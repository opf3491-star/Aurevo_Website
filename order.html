let L=sget('aurevo-lang')||'bn',D=null,P=null,V=0,Q=1,USER=null,sb=null,FILES={};
const t=k=>T[L][k]||k,CFG=window.AUREVO_CONFIG||{},authOn=()=>!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
const fmt=n=>'৳'+new Intl.NumberFormat(L==='bn'?'bn-BD':'en-US').format(n);
const qs=new URLSearchParams(location.search);
function applyTheme(m){document.documentElement.dataset.theme=m;sset('aurevo-theme',m);$('meta[name=theme-color]').content=m==='dark'?'#0D1B2A':'#F4F1DE'}
$('#theme').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#lang').onclick=()=>{keep();L=L==='bn'?'en':'bn';sset('aurevo-lang',L);draw()};
let KEEP={};function keep(){$$('#main [data-k]').forEach(e=>{if(e.type!=='file')KEEP[e.dataset.k]=e.type==='checkbox'?e.checked:e.value})}
function restore(){$$('#main [data-k]').forEach(e=>{const v=KEEP[e.dataset.k];if(v!=null&&e.type!=='file'){if(e.type==='checkbox')e.checked=v;else e.value=v}})}
const unitPrice=()=>P.variants?P.variants[V].price:P.price;
const totalP=()=>unitPrice()*Q,advP=()=>Math.ceil(totalP()*.1);
function draw(){document.documentElement.lang=L;$('#lang').textContent=L==='bn'?'EN':'বাং';$('#bk').setAttribute('aria-label',t('back'));
const m=$('#main');if(!D){return}
if(!P){m.innerHTML=`<div class="need"><p>${esc(t('noProd'))}</p><a class="btn o" href="index.html">${esc(t('home'))}</a></div>`;return}
if(authOn()&&!USER){m.innerHTML=`<div class="need"><h1>${esc(t('need'))}</h1><p style="margin:14px 0 22px"></p><button class="btn" id="goLg">${esc(t('needB'))}</button></div>`;$('#goLg').onclick=goLogin;return}
const u=unitPrice(),bn=D.bkash||'';const bnShow=bn.replace(/^880/,'0');
m.innerHTML=`<div class="eb">${esc(t('eb'))}</div><h1>${esc(t('h1'))}</h1><p class="lead">${esc(t('lead'))}</p>
<div class="wb"><b>•</b> ${esc(L==='bn'?'কিনতে আসল পরিচয় দিতে হবে, আর বেশি দামের আসবাবে ১০% আগে bKash-এ পেমেন্ট করতে হয়।':'A genuine identity is required to purchase, and higher-value pieces need a 10% advance via bKash.')}</div>
<form id="f" novalidate>
<div class="cd"><h2><i>1</i>${esc(t('c1'))}</h2><div class="pr" style="margin-top:12px"><img src="${esc(P.id)}.jpg" alt="" onerror="this.style.visibility='hidden'"><div><h3>${esc(P.name[L])}</h3><div class="p">${fmt(u)}</div></div></div>
${P.variants?`<label>${esc(t('var'))}</label><select data-k="var" id="vr">${P.variants.map((x,k)=>`<option value="${k}" ${k===V?'selected':''}>${esc(x.name[L])} — ${fmt(x.price)}</option>`).join('')}</select>`:''}
<label>${esc(t('qty'))}</label><div class="qt"><button type="button" id="qm" aria-label="-">−</button><span id="qv">${Q}</span><button type="button" id="qp" aria-label="+">+</button></div>
<div class="sum"><div><span>${esc(t('unit'))}</span><span>${fmt(u)}</span></div><div><span>${esc(t('total'))}</span><span id="tt">${fmt(totalP())}</span></div><div class="t"><span>${esc(t('adv'))}</span><span id="ad">${fmt(advP())}</span></div></div></div>
<div class="cd"><h2><i>2</i>${esc(t('c2'))}</h2><p class="hint">${esc(t('c2h'))}</p>
<div class="g2"><div><label>${esc(t('sz'))}</label><input data-k="sz" maxlength="120"></div><div><label>${esc(t('col'))}</label><input data-k="col" maxlength="120"></div></div>
<label>${esc(t('pol'))}</label><input data-k="pol" maxlength="120"><label>${esc(t('date'))}</label><input type="date" data-k="date" min="${new Date(Date.now()+864e5).toISOString().slice(0,10)}"><label>${esc(t('note'))}</label><textarea data-k="note" maxlength="500"></textarea></div>
<div class="cd"><h2><i>3</i>${esc(t('c3'))}</h2>
<label>${esc(t('nm'))} <b>*</b></label><input data-k="nm" autocomplete="name" maxlength="80"><label>${esc(t('ph'))} <b>*</b></label><input data-k="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="${esc(t('phH'))}" maxlength="11">
<div class="g2"><div><label>${esc(t('dist'))} <b>*</b></label><select data-k="dist"><option value="">${esc(t('pick'))}</option>${DIST.map(d=>`<option value="${esc(d[0])}">${esc(L==='bn'?d[1]:d[0])}</option>`).join('')}</select></div><div><label>${esc(t('area'))} <b>*</b></label><input data-k="area" maxlength="80"></div></div>
<label>${esc(t('addr'))} <b>*</b></label><textarea data-k="addr" maxlength="300"></textarea><label>${esc(t('map'))} <b>*</b></label><input data-k="map" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/…" maxlength="300"><p class="hint" style="margin:6px 0 0;font-size:12px">${esc(t('mapH'))}</p></div>
<div class="cd"><h2><i>4</i>${esc(t('c4'))}</h2><p class="hint">${esc(t('c4h'))}</p>
<label>${esc(t('selfie'))} <b>*</b></label><label class="up" style="margin:0"><input type="file" accept="image/*" capture="user" data-f="selfie"><span class="th" id="th_selfie">${ic('cam')}</span><span><b>${esc(t('tap'))}</b><span>${esc(t('selfieH'))}</span></span></label>
<label>${esc(t('idc'))} <b>*</b></label><label class="up" style="margin:0"><input type="file" accept="image/*" data-f="id"><span class="th" id="th_id">${ic('id')}</span><span><b>${esc(t('tap'))}</b><span>${esc(t('idH'))}</span></span></label>
<div class="lock">${ic('lock')}<span>${esc(t('lockT'))}</span></div></div>
<div class="cd"><h2><i>5</i>${esc(t('c5'))}</h2><p class="hint">${esc(t('c5h'))}</p>
<div class="bk"><div class="eb">${esc(t('adv'))}</div><div class="am" id="am">${fmt(advP())}</div><div class="nm"><span>${esc(t('bnum'))}: <b dir="ltr">${esc(bnShow)}</b></span><button type="button" class="cp" id="cpy">${esc(t('copy'))}</button></div><ol><li>${esc(t('s1'))}</li><li>${esc(t('s2'))}</li><li>${esc(t('s3'))}</li></ol></div>
<label>${esc(t('sndr'))} <b>*</b></label><input data-k="snd" type="tel" inputmode="numeric" maxlength="11"><label>${esc(t('trx'))} <b>*</b></label><input data-k="trx" autocapitalize="characters" maxlength="12" style="text-transform:uppercase"></div>
<div class="cd"><label class="ck" style="margin:0"><input type="checkbox" data-k="agree"><span>${esc(t('agree'))}</span></label><p class="er" id="er" role="alert"></p><button class="btn" id="sbm" type="submit">${esc(t('submit'))}</button></div></form>
<div id="mineB"></div>`;
restore();wire();setThumbs();mine()}
function wire(){$('#qm').onclick=()=>{Q=Math.max(1,Q-1);upd()};$('#qp').onclick=()=>{Q=Math.min(20,Q+1);upd()};
const vr=$('#vr');if(vr)vr.onchange=()=>{keep();V=+vr.value;draw()};
$('#cpy').onclick=()=>{const n=(D.bkash||'').replace(/^880/,'0');(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>{$('#cpy').textContent=t('copied')}).catch(()=>{prompt(t('bnum'),n)})};
$$('[data-f]').forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;try{FILES[i.dataset.f]=await shrink(f);setThumbs();$('#er').textContent=''}catch(e){delete FILES[i.dataset.f];i.value='';$('#er').textContent=t('e_img2')}});
$('#f').onsubmit=submit}
function upd(){$('#qv').textContent=Q;$('#tt').textContent=fmt(totalP());$('#ad').textContent=fmt(advP());$('#am').textContent=fmt(advP())}
function setThumbs(){['selfie','id'].forEach(k=>{const e=$('#th_'+k);if(e&&FILES[k]){e.innerHTML='';const i=document.createElement('img');i.src=FILES[k].url;i.alt='';e.appendChild(i)}})}
function shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{try{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok({blob:b,url:URL.createObjectURL(b)}):no(),'image/jpeg',.82)}catch(e){no(e)}};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
const g=k=>(($('[data-k='+k+']')||{}).value||'').trim();
async function submit(e){e.preventDefault();const er=$('#er'),set=m=>{er.textContent=m;er.scrollIntoView({block:'center',behavior:'smooth'})};
const ph=g('ph'),snd=g('snd'),trx=g('trx').toUpperCase(),mp=g('map');
if(!g('nm')||!ph||!g('dist')||!g('area')||!g('addr')||!mp||!snd||!trx)return set(t('e_req'));
if(!/^01[3-9]\d{8}$/.test(ph))return set(t('e_ph'));if(g('addr').length<12)return set(t('e_addr'));
if(!/^https:\/\/\S+$/i.test(mp))return set(t('e_map'));if(!FILES.selfie||!FILES.id)return set(t('e_img'));
if(!/^01[3-9]\d{8}$/.test(snd))return set(t('e_snd'));if(!/^[A-Z0-9]{8,12}$/.test(trx))return set(t('e_trx'));if(!$('[data-k=agree]').checked)return set(t('e_agree'));
if(!sb||!USER)return set(t('e_sys'));
const b=$('#sbm');b.disabled=true;b.textContent=t('sending');er.textContent='';
try{const rid=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2),base=USER.id+'/'+rid;
for(const k of ['selfie','id']){const r=await sb.storage.from('kyc').upload(base+'-'+k+'.jpg',FILES[k].blob,{contentType:'image/jpeg',upsert:false});if(r.error){console.error(r.error);throw {code:'up'}}}
const v=P.variants?P.variants[V]:null,row={product_id:P.id,product_name:P.name.en,variant:v?v.name.en:null,unit_price:unitPrice(),qty:Q,total:totalP(),advance_due:advP(),customer_name:g('nm'),phone:ph,district:g('dist'),area:g('area'),address:g('addr'),map_link:mp,size_note:g('sz')||null,colour_note:g('col')||null,polish_note:g('pol')||null,wanted_date:g('date')||null,notes:g('note')||null,selfie_path:base+'-selfie.jpg',id_path:base+'-id.jpg',bkash_sender:snd,bkash_trx:trx};
const r=await sb.from('orders').insert(row).select('order_no').single();
if(r.error){console.error(r.error);throw r.error}
done(r.data.order_no,v)}
catch(x){b.disabled=false;b.textContent=t('submit');const m=(x&&x.message||'')+'';
if(x&&x.code==='up')set(t('e_up'));else if(x&&(x.code==='23505'||/duplicate|unique/i.test(m)))set(t('e_dup'));else if(x&&(x.code==='42P01'||x.code==='PGRST205'||/relation|schema cache|does not exist|Bucket not found/i.test(m)))set(t('e_sys'));else set(t('e_gen'))}}
function done(no,v){const code='AV-'+no,num=(D.whatsapp||'').replace(/\D/g,''),msg=`AUREVO ${code} — ${P.name[L]}${v?' ('+v.name[L]+')':''} × ${Q}\n${t('wa')}`;
$('#main').innerHTML=`<div class="cd ok">${ic('done')}<h1>${esc(t('okT'))}</h1><p>${esc(t('okP'))}</p><div class="cod">${esc(code)}</div><div style="display:grid;gap:10px;margin-top:20px"><a class="btn" target="_blank" rel="noopener noreferrer" href="https://wa.me/${num}?text=${encodeURIComponent(msg)}">${ic('chat')}${esc(t('okW'))}</a><a class="btn o" href="index.html">${esc(t('okH'))}</a></div></div><div id="mineB"></div>`;scrollTo(0,0);mine()}
async function mine(){const box=$('#mineB');if(!box||!sb||!USER)return;const r=await sb.from('orders').select('order_no,product_name,variant,qty,total,status,created_at').order('created_at',{ascending:false}).limit(10);if(r.error||!box.isConnected)return;
if(!r.data.length){if(!$('#f'))return;box.innerHTML='';return}
box.innerHTML=`<div class="cd" style="margin-top:22px"><h2>${esc(t('mine'))}</h2>${r.data.map(o=>`<div class="mo"><div><b>AV-${o.order_no} · ${esc(o.product_name)}${o.variant?' ('+esc(o.variant)+')':''} × ${o.qty}</b><br><span>${fmt(o.total)} · ${new Date(o.created_at).toLocaleDateString(L==='bn'?'bn-BD':'en-GB')}</span></div><span class="st">${esc(t('s_'+o.status))}</span></div>`).join('')}</div>`}
function goLogin(){sset('aurevo-next',location.pathname.split('/').pop()+location.search);location.href='index.html#login'}
function loadSB(){return(async()=>{if(window.supabase)return;try{const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/+esm');window.supabase={createClient:m.createClient}}catch(x){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}})()}
(async()=>{applyTheme(sget('aurevo-theme')||'dark');document.documentElement.lang=L;
try{D=await (await fetch('products.json')).json()}catch(e){$('#main').innerHTML=`<div class="need"><p>products.json</p></div>`;return}
P=D.products.find(x=>x.id===qs.get('p'));V=Math.min(+qs.get('v')||0,P&&P.variants?P.variants.length-1:0);if(P)$('#bk').href='index.html#p='+P.id;
if(authOn()){try{await loadSB();sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);const r=await sb.auth.getSession();USER=r.data.session?r.data.session.user:null}catch(e){console.error(e)}}
draw()})();
</script>
