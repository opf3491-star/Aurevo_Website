<style>
:root{--bg:#141411;--bg2:#1c1b17;--text:#f2eee6;--muted:#aaa397;--line:rgba(225,207,171,.2);--gold:#c9ad7a;--gold2:#e1cca4;--g1:rgba(255,255,255,.11);--g2:rgba(255,255,255,.02);--gb:rgba(255,255,255,.24);--hi:rgba(255,255,255,.4);--sh:rgba(0,0,0,.35);--wall:#26231d;--floor:#171612;--logo:none}
[data-theme=light]{--bg:#f3f0e9;--bg2:#e9e3d8;--text:#25231e;--muted:#6e685d;--line:rgba(100,82,53,.22);--gold:#8c6c3c;--gold2:#6f5329;--g1:rgba(255,255,255,.65);--g2:rgba(255,255,255,.18);--gb:rgba(110,90,60,.28);--hi:rgba(255,255,255,.95);--sh:rgba(60,45,25,.14);--wall:#e4dccd;--floor:#cdbfa8;--logo:brightness(.3) contrast(1.2)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "DM Sans","Hind Siliguri",sans-serif;overflow-x:hidden;transition:background .3s,color .3s}
[lang=bn] body{font-family:"Hind Siliguri","DM Sans",sans-serif}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}img{max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(1200px,calc(100% - 32px));margin:auto}
/* clear glass: transparent, thin edge, natural highlight, NO blur */
.glass{background:linear-gradient(135deg,var(--g1),var(--g2) 45%,var(--g1));border:1px solid var(--gb);border-radius:18px;box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--g2),0 12px 34px var(--sh)}
header{position:sticky;top:0;z-index:30;padding:10px 0;padding-top:max(10px,env(safe-area-inset-top))}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:10px}.brand img.s{height:34px;filter:var(--logo)}.brand img.w{height:15px;filter:var(--logo)}
.links{display:flex;gap:22px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.links a:hover{color:var(--gold2)}
.tools{display:flex;gap:8px}.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--gb);background:linear-gradient(135deg,var(--g1),var(--g2));font-size:12px;cursor:pointer;box-shadow:inset 0 1px 0 var(--hi)}
.chip:hover{border-color:var(--gold)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;min-height:620px;padding:30px 0 60px}
.eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold2)}
h1,h2,h3{font-family:"Playfair Display","Hind Siliguri",serif;font-weight:500;margin:0}
.hero h1{font-size:clamp(40px,6vw,76px);line-height:1.08;margin:18px 0;letter-spacing:-.02em}.hero h1 em{color:var(--gold2);font-style:normal}
.hero p{color:var(--muted);max-width:440px}
.btn{display:inline-flex;padding:13px 22px;border:1px solid var(--gold);border-radius:99px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:none}
.btn.p{background:var(--gold);color:#171612;border-color:var(--gold)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.room{position:relative;height:500px;border-radius:22px;overflow:hidden;background:linear-gradient(var(--wall) 0 62%,var(--floor) 62%);border:1px solid var(--gb)}
.room:before{content:"";position:absolute;left:0;right:0;top:62%;height:1px;background:var(--line)}
.room:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(201,173,122,.2),transparent 60%);pointer-events:none}
.win{position:absolute;top:9%;left:9%;width:26%;height:36%;border:1px solid var(--gb);background:linear-gradient(160deg,var(--g1),transparent);border-radius:6px}
.room img.rs{position:absolute;left:50%;top:44%;height:180px;transform:translate(-50%,-50%);opacity:.9;filter:var(--logo);transition:opacity .6s}
.room model-viewer{position:absolute;inset:0;width:100%;height:100%;background:transparent;--poster-color:transparent;z-index:2;opacity:0;transition:opacity .8s}
.room.on model-viewer{opacity:1}.room.on img.rs{opacity:0}
.room small{position:absolute;left:16px;bottom:12px;z-index:3;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
section.s{padding:64px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.head h2{font-size:clamp(30px,4vw,46px);line-height:1.15;margin-top:8px}.head p{max-width:380px;color:var(--muted);margin:0;font-size:13px}
.divs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.div{padding:26px;min-height:170px}.div small{color:var(--gold2);letter-spacing:.18em;font-size:10px}.div h3{font-size:23px;margin:16px 0 6px}.div p{color:var(--muted);font-size:13px;margin:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:12px}
.bar input,.bar select{background:transparent;border:1px solid var(--gb);border-radius:12px;padding:10px 12px;font-size:13px}.bar select option{background:var(--bg)}.bar input[type=search]{flex:1;min-width:170px}.bar input[type=number]{width:118px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{cursor:pointer;overflow:hidden;transition:transform .25s,border-color .25s;text-align:left;padding:0;display:block;width:100%}.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.cv{height:190px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,rgba(201,173,122,.18),transparent 65%)}.cv img{height:84px;filter:var(--logo);opacity:.75}
.ci{padding:14px}.cm{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}.ci h3{font-size:17px;margin:9px 0 4px}.ci p{margin:0;font-size:12px;color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.sub{font-size:13px;color:var(--muted);margin:0 0 14px}
dialog{border:0;padding:0;background:none;width:min(920px,calc(100% - 20px));max-height:92vh;color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.7)}
.dg{display:grid;grid-template-columns:1.1fr .9fr;background:var(--bg);border:1px solid var(--gb);border-radius:20px;overflow:hidden}
.dv{position:relative;min-height:420px;background:var(--bg2);display:grid;place-items:center}.dv model-viewer{position:absolute;inset:0;width:100%;height:100%;background:transparent;--poster-color:transparent}
.dv .fb{padding:24px;text-align:center;color:var(--muted);font-size:13px}.dc{padding:28px;align-self:center}.dc h2{font-size:30px;margin:10px 0}.dc dl{margin:14px 0;font-size:13px}.dc dt{color:var(--muted);float:left;clear:left;width:46%}.dc dd{margin:0 0 6px 46%}
.x{position:absolute;top:10px;right:10px;z-index:5}
.story{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.sv{min-height:300px;display:grid;place-items:center;background:radial-gradient(ellipse,rgba(201,173,122,.22),transparent 62%)}.sv img{height:190px;filter:var(--logo)}.sc{padding:clamp(24px,5vw,56px);align-self:center}.sc h2{font-size:36px;margin:12px 0}.sc p{color:var(--muted)}
footer{border-top:1px solid var(--line);padding:36px 0 30px;margin-top:30px;color:var(--muted);font-size:12px}.fr{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}
/* sections slide in from the right */
.js .rv{opacity:0;transform:translateX(80px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.card{transition:none}}
@media(max-width:900px){.links{display:none}.hero{grid-template-columns:1fr;min-height:0}.room{order:-1;height:340px}.divs{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dg,.story{grid-template-columns:1fr}.dv{min-height:320px}}
@media(max-width:480px){.grid{gap:9px}.cv{height:140px}.ci{padding:10px}.ci h3{font-size:14px}.brand img.w{display:none}.bar input[type=number]{width:46%}}
@media(max-width:300px){.hero p,.head p,.divs,.story{display:none}}
</style>
</head>

const r=[[t('type'),p.type[L]],[t('cond'),p.condition==='new'?t('condNew'):null],[t('price'),p.price?fmt(p.price):t('tbc')],[t('making'),p.makingDays?p.makingDays+' '+t('days'):t('tbc')],[t('delivery'),p.deliveryDays?p.deliveryDays+' '+t('days'):null],[t('dim'),p.dimensions],[t('mat'),p.materials],[t('col'),p.colour]].filter(x=>x[1]);
$('#dList').innerHTML=r.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('');
const w=$('#wa'),num=(D.whatsapp||'').replace(/\D/g,'');w.textContent=t('order');
if(/^8801\d{9}$/.test(num)){const m=`AUREVO — ${p.name[L]}${p.price?' ('+fmt(p.price)+')':''}\n${t('ord')}\n${location.href.split('#')[0]}`;w.href=`https://wa.me/${num}?text=${encodeURIComponent(m)}`;w.removeAttribute('aria-disabled')}else{w.removeAttribute('href');w.setAttribute('aria-disabled','true');w.style.opacity=.5}
if(!p.model){dv.innerHTML=`<div class="fb">${t('noModel')}</div>`}else{dv.innerHTML=`<div class="fb" id="ld">${t('loading3d')}</div>`;loadMV().then(()=>{const m=document.createElement('model-viewer');m.src=p.model;m.setAttribute('camera-controls','');m.setAttribute('touch-action','pan-y');m.setAttribute('shadow-intensity','1');m.setAttribute('exposure','1');m.setAttribute('environment-image','neutral');m.setAttribute('alt',p.name[L]+' 3D');m.addEventListener('load',()=>{const l=$('#ld');l&&l.remove()});m.addEventListener('error',()=>{dv.innerHTML=`<div class="fb">${t('err3d')}</div>`});dv.appendChild(m)}).catch(()=>{dv.innerHTML=`<div class="fb">${t('err3d')}</div>`})}
$('#dlg').showModal()}
$('#close').onclick=()=>$('#dlg').close();$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close()});$('#dlg').addEventListener('close',()=>$('#dv').innerHTML='');
// hero 3D loads only after page is idle, and never on low-memory / data-saver phones
function heroModel(){const c=navigator.connection||{};if(c.saveData||(navigator.deviceMemory&&navigator.deviceMemory<=2))return;loadMV().then(()=>{const m=document.createElement('model-viewer');m.src='mid_century_lounge_chair.glb';['camera-controls','disable-pan','disable-zoom'].forEach(a=>m.setAttribute(a,''));m.setAttribute('interaction-prompt','none');m.setAttribute('touch-action','pan-y');m.setAttribute('environment-image','neutral');m.setAttribute('shadow-intensity','.8');m.setAttribute('alt','AUREVO 3D');m.addEventListener('load',()=>$('#room').classList.add('on'));$('#room').appendChild(m)}).catch(()=>{})}
addEventListener('load',()=>('requestIdleCallback'in window?requestIdleCallback(heroModel,{timeout:4000}):setTimeout(heroModel,2500)));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach(e=>io.observe(e));
