.cv,.cv{height:auto!important;aspect-ratio:1/1}

header .nav.glass{background:var(--bg)}@supports(background:color-mix(in srgb,red,blue)){header .nav.glass{background:linear-gradient(135deg,var(--g1),var(--g2) 45%,var(--g1)),color-mix(in srgb,var(--bg) 92%,transparent)}}

.dg,.ex{max-width:1200px;margin-inline:auto;width:100%}.dsc .ex:last-child{padding-bottom:max(28px,env(safe-area-inset-bottom))}

/* premium colour grading */
:root{--bg:#12110e;--bg2:#1b1914;--gold:#cdb184;--gold2:#e8d4a6}[data-theme=light]{--bg:#f4f0e8;--bg2:#ebe4d6;--gold:#8a6a38;--gold2:#6b4f26}

.btn.p{background:linear-gradient(135deg,#ecd9ad,#b8985f);border-color:#cdb184;color:#171612}.hero h1 em{background:linear-gradient(120deg,#f1dfb4,#c4a56b);-webkit-background-clip:text;background-clip:text;color:transparent}

.tg{position:relative;width:58px;height:30px;border-radius:99px;border:1px solid var(--gb);background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 var(--hi);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:space-around;font-size:11px;color:var(--muted)}

.tg b,.tg span{position:relative;z-index:1;font-weight:600;line-height:1}.tl b:first-of-type{color:#171612}.tl[data-l=en] i{transform:translateX(28px)}.tl[data-l=en] b:first-of-type{color:var(--muted)}.tl[data-l=en] b:nth-of-type(2){color:#171612}

@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}@keyframes spin{to{--a:360deg}}

function cardEl(p){const b=document.createElement('button');b.className='card glass';b.innerHTML=`<div class="cv"><img src="${p.id}.jpg" alt="${p.name[L]}" loading="lazy" onerror="this.onerror=null;this.src='logo-star.png';this.className='ph'"></div><div class="ci"><div class="cm"><span>${p.division}</span><span>${p.type[L]}</span></div><h3>${p.name[L]}</h3><p>${pTxt(p)}</p></div>`;b.setAttribute('aria-label',p.name[L]);b.onclick=()=>open(p);return b}
function waFloat(){const n=(D.whatsapp||'').replace(/\D/g,'');const a=$('#waf');if(/^8801\d{9}$/.test(n)){a.href=`https://wa.me/${n}?text=${encodeURIComponent(t('waMsg'))}`;a.style.display=''}else a.style.display='none'}
function list(arr,box,emptyKey){box.innerHTML='';if(!arr.length){box.innerHTML=`<div class="empty glass" style="grid-column:1/-1">${t(emptyKey)}</div>`;return}
arr.forEach(p=>box.appendChild(cardEl(p)))}
function render(){const q=$('#q').value.toLowerCase(),ty=$('#type').value,dv=$('#div').value,mn=+$('#pmin').value||0,mx=+$('#pmax').value||0,so=$('#sort').value;
let a=D.products.filter(p=>(!q||(p.name.en+p.name.bn+p.type.en).toLowerCase().includes(q))&&(!ty||p.type.en===ty)&&(!dv||p.division===dv)&&((!mn&&!mx)||(p.price&&(!mn||p.price>=mn)&&(!mx||p.price<=mx))));
if(so)a.sort((x,y)=>(x.price==null)-(y.price==null)||(so==='lh'?x.price-y.price:y.price-x.price));
list(a,$('#gridS'),'none');list(D.sets||[],$('#gridK'),'setsEmpty')}
['q','type','div','pmin','pmax','sort'].forEach(i=>$('#'+i).addEventListener('input',render));
let mvP;function loadMV(){return mvP||(mvP=new Promise((ok,no)=>{if(customElements.get('model-viewer'))return ok();const s=document.createElement('script');s.type='module';s.src='https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js';s.onload=()=>ok();s.onerror=no;document.head.appendChild(s)}))}
function show3d(p,dv){const l=document.createElement('div');l.id='ld';l.innerHTML=`<span>${t('loading3d')}</span>`;dv.appendChild(l);loadMV().then(()=>{if(!dv.querySelector('#ld'))return;const m=document.createElement('model-viewer');m.src=p.model;['camera-controls'].forEach(a=>m.setAttribute(a,''));m.setAttribute('touch-action','pan-y');m.setAttribute('shadow-intensity','1');m.setAttribute('environment-image','neutral');m.setAttribute('alt',p.name[L]+' 3D');m.addEventListener('load',()=>{const x=dv.querySelector('#ld');x&&x.remove()});m.addEventListener('error',()=>{const x=dv.querySelector('#ld');x&&(x.innerHTML=`<span>${t('err3d')}</span>`)});dv.appendChild(m)}).catch(()=>{const x=dv.querySelector('#ld');x&&(x.innerHTML=`<span>${t('err3d')}</span>`)})}
function open(p){const dv=$('#dv');$('#dEyebrow').textContent='AUREVO '+p.division;$('#dName').innerHTML=p.name[L]+(p.madeToOrder?`<span class="badge">${t('mto')}</span>`:'');
dv.innerHTML=`<img src="${p.id}.jpg" alt="${p.name[L]}" onerror="this.onerror=null;this.src='logo-star.png';this.className='ph'">`+(p.model?`<div class="tabs"><button class="chip on" data-m="p">${t('photo')}</button><button class="chip" data-m="3">3D</button></div>`:'');
dv.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{dv.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));dv.querySelectorAll('model-viewer,#ld').forEach(x=>x.remove());if(b.dataset.m==='3')show3d(p,dv)});
let vi=0;const pr=()=>{const v=p.variants?p.variants[vi].price:p.price;$('#dPrice').textContent=v?fmt(v):t('tbc')};pr();
$('#dVar').innerHTML='';if(p.variants)p.variants.forEach((v,i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' on':'');b.textContent=v.name[L];b.onclick=()=>{vi=i;$('#dlg .dsc').style.setProperty('--tone',i?'rgba(140,165,190,.18)':'rgba(205,177,132,.16)');$('#dVar').querySelectorAll('.chip').forEach((x,k)=>x.classList.toggle('on',k===i));pr()};$('#dVar').appendChild(b)});
const r=[[t('type'),p.type[L]],[t('cond'),p.condition==='new'?t('condNew'):null],[t('size'),p.size&&p.size[L]],[t('mat'),p.materials&&p.materials[L]],[t('making'),p.madeToOrder?(p.makingDays?p.makingDays+' '+t('days'):t('tbc')):null]].filter(x=>x[1]);
$('#dList').innerHTML=r.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('');$('#dDesc').textContent=(p.description&&p.description[L])||'';
const w=$('#wa'),num=(D.whatsapp||'').replace(/\D/g,'');w.textContent=t('order');
if(/^8801\d{9}$/.test(num)){const m=`AUREVO — ${p.name[L]}${(p.variants?p.variants[vi].price:p.price)?' ('+fmt(p.variants?p.variants[vi].price:p.price)+')':''}\n${t('ord')}\n${location.href.split('#')[0]}`;w.href=`https://wa.me/${num}?text=${encodeURIComponent(m)}`}else{w.removeAttribute('href');w.style.opacity=.5}
const same=D.products.filter(x=>x.id!==p.id&&x.type.en===p.type.en),oth=D.products.filter(x=>x.id!==p.id&&x.type.en!==p.type.en);const rail=$('#rail');rail.innerHTML='';[...same,...oth.slice(0,Math.max(3,10-same.length))].slice(0,10).forEach(x=>{const c=cardEl(x);c.onclick=()=>{open(x);$('#dlg .dsc').scrollTop=0};rail.appendChild(c)});
if(!$('#dlg').open){history.pushState({dlg:1},'');$('#dlg').showModal()}$('#dlg .dsc').scrollTop=0}
$('#close').onclick=()=>$('#dlg').close();$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close()});$('#dlg').addEventListener('close',()=>{$('#dv').innerHTML='';if(history.state&&history.state.dlg)history.back()});addEventListener('popstate',()=>{if($('#dlg').open)$('#dlg').close()});
document.querySelectorAll('.hb').forEach(i=>i.onerror=()=>{i.remove();const r=document.querySelector('.hb');if(r)r.classList.add('d','l')});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach(e=>io.observe(e));
applyTheme(localStorage.getItem('aurevo-theme')||'dark');$('#yr').textContent=new Date().getFullYear();
fetch('address.json').then(r=>r.json()).then(a=>{ADDR=a;renderAddr()}).catch(()=>{});fetch('products.json').then(r=>r.json()).then(j=>{D=j;buildTypes();applyLang()}).catch(()=>{$('#gridS').innerHTML='<div class="empty glass">products.json</div>'});applyLang();

/* ---------- login (Supabase) ---------- */
const CFG=window.AUREVO_CONFIG||{};const authOn=()=>!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
let sb=null,USER=null,libP=null;var authReady=false;
function loadSB(){return libP||(libP=(async()=>{if(window.supabase)return;try{const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/+esm');window.supabase={createClient:m.createClient}}catch(x){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}})())}
const authMsg=m=>{$('#authMsg').textContent=m||''};
function renderAcct(){const b=$('#acct');if(!authOn()){b.hidden=true;return}b.hidden=false;b.textContent='';if(USER){const m=USER.user_metadata||{},u=m.avatar_url||m.picture;if(u){const i=document.createElement('img');i.src=u;i.alt='';i.referrerPolicy='no-referrer';i.style.cssText='width:22px;height:22px;border-radius:50%;display:block';b.appendChild(i)}else b.textContent=((m.full_name||m.name||USER.email||'?')[0]||'?').toUpperCase()}else b.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>'}
function openLogin(){authMsg('');$('#login').showModal()}
async function initAuth(){renderAcct();if(!authOn())return;try{await loadSB();sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);const r=await sb.auth.getSession();USER=r.data.session?r.data.session.user:null;renderAcct();sb.auth.onAuthStateChange((ev,s)=>{USER=s?s.user:null;renderAcct();if(USER&&$('#login').open)$('#login').close()})}catch(e){console.error(e)}}
$('#acct').onclick=()=>{if(USER){$('#acctWho').textContent=((USER.user_metadata||{}).full_name||'')+' '+(USER.email||'');$('#acctMsg').textContent='';$('#acctDlg').showModal()}else openLogin()};
$('#lgClose').onclick=()=>$('#login').close();$('#acClose').onclick=()=>$('#acctDlg').close();
$('#wa').addEventListener('click',e=>{if(!authOn())return;if(!authReady){e.preventDefault();const u=$('#wa').href;initP.then(()=>{USER?window.open(u,'_blank','noopener'):openLogin()});return}if(!USER){e.preventDefault();openLogin()}});
document.querySelectorAll('[data-oauth]').forEach(b=>b.onclick=async()=>{if(!sb)return authMsg(t('authErr'));const r=await sb.auth.signInWithOAuth({provider:b.dataset.oauth,options:{redirectTo:location.origin+location.pathname}});if(r.error)authMsg(t('authErr'))});
const cred=()=>{const e=$('#aEmail').value.trim(),p=$('#aPass').value;if(!sb){authMsg(t('authErr'));return null}if(!/^\S+@\S+\.\S+$/.test(e)){authMsg(t('a_email'));return null}if(p.length<8){authMsg(t('pwShort'));return null}return{email:e,password:p}};
$('#doLogin').onclick=async()=>{const c=cred();if(!c)return;const r=await sb.auth.signInWithPassword(c);if(r.error)authMsg(/invalid/i.test(r.error.message)?t('badCred'):t('authErr'))};
$('#doSignup').onclick=async()=>{const c=cred();if(!c)return;const r=await sb.auth.signUp({...c,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)return authMsg(t('authErr'));if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)return authMsg(t('dupe'));if(!r.data.session)authMsg(t('verify'))};
$('#doOut').onclick=async()=>{if(sb)await sb.auth.signOut();USER=null;renderAcct();$('#acctDlg').close()};
$('#doDel').onclick=async()=>{if(!sb||!confirm(t('delConfirm')))return;const r=await sb.rpc('delete_my_account');if(r.error){$('#acctMsg').textContent=t('delErr');return}await sb.auth.signOut();USER=null;renderAcct();$('#acctDlg').close()};
$('#emTog').onclick=()=>{const b=$('#emBox');b.hidden=!b.hidden};
document.querySelector('.bn a[href="#acct"]').addEventListener('click',e=>{e.preventDefault();$('#acct').click()});
(()=>{const ids=['top','cats','collection'],as=[...document.querySelectorAll('.bn a')];function upd(){let k=0;ids.forEach((id,i)=>{const e=document.getElementById(id);if(e&&e.getBoundingClientRect().top<innerHeight*.45)k=i});as.forEach((a,i)=>a.classList.toggle('on',(i===k)&&i<3))}
const bnIdx={0:0,1:1,2:2};addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);upd()})();
var initP=initAuth().finally(()=>{authReady=true});
</script>
