<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AUREVO Admin</title>
<meta name="theme-color" content="#0D1B2A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Serif+Bengali:wght@500&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0D1B2A;--card:#1B263B;--text:#F4F1DE;--mut:rgba(244,241,222,.66);--acc:#D4C4A8;--sage:#778D7A;--line:rgba(212,196,168,.18);--ln2:rgba(212,196,168,.4);--btn:#D4C4A8;--btnt:#0D1B2A;--err:#E8AEAE;--ok:#9DBBA0}
[data-theme=light]{color-scheme:light;--bg:#F4F1DE;--card:#FBF9EE;--text:#0D1B2A;--mut:rgba(13,27,42,.66);--acc:#6F5F42;--line:rgba(65,90,119,.2);--ln2:rgba(65,90,119,.42);--btn:#0D1B2A;--btnt:#F4F1DE;--err:#9A4545;--ok:#3E6B47}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:400 14.5px/1.6 "Hind Siliguri","Jost",sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Noto Serif Bengali",serif;font-weight:500;margin:0}a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hb{max-width:980px;margin:auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wm{font:300 14px "Jost",sans-serif;letter-spacing:.4em;text-transform:uppercase}.wm small{letter-spacing:.1em;color:var(--acc);margin-left:6px;font-size:12px}
.sm{border:1px solid var(--ln2);background:none;border-radius:99px;padding:6px 14px;font-size:12.5px}
nav.tb{max-width:980px;margin:auto;display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}nav.tb button{flex:none;border:1px solid var(--line);background:none;border-radius:99px;padding:8px 16px;font-size:13.5px}nav.tb button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
nav.tb i{font-style:normal;background:var(--err);color:#0D1B2A;border-radius:99px;padding:0 7px;margin-left:6px;font-size:11.5px}
main{max-width:980px;margin:auto;padding:16px 14px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar input,.bar select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;min-width:0}.bar input{flex:1;min-width:150px}.bar select option{background:var(--bg)}
.cd{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.top b{font:500 18px "Noto Serif Bengali",serif}.top small{color:var(--mut)}
.st{font-size:12px;border:1px solid var(--ln2);border-radius:99px;padding:3px 12px;white-space:nowrap}.st.s0{border-color:var(--err);color:var(--err)}.st.s1,.st.s6{color:var(--ok);border-color:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13.5px;margin:12px 0}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.b{border:1px solid var(--ln2);background:none;border-radius:99px;padding:8px 16px;font-size:13px;text-decoration:none;display:inline-block}.b.p{background:var(--btn);color:var(--btnt);border-color:var(--btn)}.b.d{color:var(--err);border-color:var(--err)}.b:disabled{opacity:.5}
.row select{background:var(--card);border:1px solid var(--ln2);border-radius:99px;padding:8px 12px;font-size:13px}.row select option{background:var(--bg)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.pics figure{margin:0}.pics img{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--bg)}.pics figcaption{font-size:12px;color:var(--mut);margin-bottom:4px}
.msg{padding:30px 10px;text-align:center;color:var(--mut)}.msg h2{margin-bottom:10px;color:var(--text)}.er{color:var(--err)}
.sec{font:500 12px "Jost",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin:22px 0 10px}
.rv p{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--btn);color:var(--btnt);padding:10px 20px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:all .35s;z-index:50}.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header><div class="hb"><span class="wm">Λurevo<small>Admin</small></span><div style="display:flex;gap:6px"><button class="sm" id="th">থিম</button><button class="sm" id="rf" hidden>রিফ্রেশ</button><button class="sm" id="lo" hidden>লগআউট</button></div></div>
<nav class="tb" id="tb" hidden><button data-t="orders" class="on">অর্ডার</button><button data-t="reviews">রিভিউ</button><button data-t="users">ব্যবহারকারী</button></nav></header>
<main id="m"><div class="msg">…</div></main>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script>
const ADMIN='faunakids.business@gmail.com';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sget=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const CFG=window.AUREVO_CONFIG||{};let sb=null,USER=null,TAB='orders',ORD=[],REV=[],USR=[],QO='',FO='';
const ST=[['submitted','যাচাই চলছে'],['confirmed','নিশ্চিত'],['wood','কাঠ বাছাই'],['making','তৈরি হচ্ছে'],['polish','পালিশ'],['ready','তৈরি শেষ'],['cancelled','বাতিল']];
const stL=s=>(ST.find(x=>x[0]===s)||[0,s])[1],stC=s=>({submitted:'s0',confirmed:'s1',ready:'s6'}[s]||'');
const tk=n=>'৳'+new Intl.NumberFormat('bn-BD').format(n);
const dt=d=>d?new Date(d).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'}):'—';
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.remove('on'),2200)}
function theme(m){document.documentElement.dataset.theme=m;sset('aurevo-theme',m)}
$('#th').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function msg(h,p,btn,fn){$('#m').innerHTML=`<div class="msg"><h2>${esc(h)}</h2><p>${p||''}</p></div>`;if(btn){const b=document.createElement('button');b.className='b p';b.textContent=btn;b.onclick=fn;$('#m .msg').appendChild(b)}}
function loadSB(){return(async()=>{if(window.supabase)return;try{const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/+esm');window.supabase={createClient:m.createClient}}catch(x){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}})()}
$('#lo').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};$('#rf').onclick=()=>loadAll();
$('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;TAB=b.dataset.t;$('#tb').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()};
async function loadAll(){const [o,r,u]=await Promise.all([sb.from('orders').select('*').order('created_at',{ascending:false}).limit(300),sb.from('reviews').select('*').order('created_at',{ascending:false}).limit(300),sb.rpc('admin_users')]);
ORD=o.data||[];REV=r.data||[];USR=u.data||[];const er=o.error||r.error||u.error;if(er){console.error(er);toast('লোড হয়নি: '+(er.message||'').slice(0,60))}render()}
function render(){const np=REV.filter(x=>!x.approved).length,ns=ORD.filter(x=>x.status==='submitted').length;
$('#tb').querySelectorAll('button').forEach(b=>{const n=b.dataset.t==='orders'?ns:b.dataset.t==='reviews'?np:0;b.querySelector('i')?.remove();if(n)b.insertAdjacentHTML('beforeend',`<i>${n}</i>`)});
({orders:rOrders,reviews:rReviews,users:rUsers})[TAB]()}
function rOrders(){const m=$('#m');m.innerHTML=`<div class="bar"><input id="qo" type="search" placeholder="নাম, মোবাইল, অর্ডার নম্বর বা TrxID খুঁজুন" value="${esc(QO)}"><select id="fo"><option value="">সব অবস্থা</option>${ST.map(s=>`<option value="${s[0]}" ${FO===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></div><div id="ol"></div>`;
$('#qo').oninput=e=>{QO=e.target.value;list()};$('#fo').onchange=e=>{FO=e.target.value;list()};list()}
function list(){const q=QO.trim().toLowerCase(),box=$('#ol');const a=ORD.filter(o=>(!FO||o.status===FO)&&(!q||('av-'+o.order_no+' '+o.customer_name+' '+o.phone+' '+o.bkash_trx+' '+o.bkash_sender+' '+o.product_name).toLowerCase().includes(q)));
if(!a.length){box.innerHTML='<div class="msg">কোনো অর্ডার নেই।</div>';return}box.innerHTML='';a.forEach(o=>box.appendChild(oCard(o)))}
function oCard(o){const c=document.createElement('div');c.className='cd';const wa='https://wa.me/88'+o.phone+'?text='+encodeURIComponent(`AUREVO AV-${o.order_no} — আপনার অর্ডার নিয়ে কথা বলতে চাই।`);
c.innerHTML=`<div class="top"><div><b>AV-${o.order_no} · ${esc(o.product_name)}${o.variant?' ('+esc(o.variant)+')':''} × ${o.qty}</b><br><small>${dt(o.created_at)}</small></div><span class="st ${stC(o.status)}">${esc(stL(o.status))}</span></div>
<dl class="kv"><dt>মোট</dt><dd>${tk(o.total)} · অগ্রিম ${tk(o.advance_due)}</dd><dt>bKash</dt><dd dir="ltr" style="text-align:left">${esc(o.bkash_trx)} · ${esc(o.bkash_sender)}</dd><dt>নাম</dt><dd>${esc(o.customer_name)}</dd><dt>মোবাইল</dt><dd dir="ltr" style="text-align:left">${esc(o.phone)}</dd><dt>ঠিকানা</dt><dd>${esc(o.address)}, ${esc(o.area)}, ${esc(o.district)}</dd>
${o.size_note?`<dt>সাইজ</dt><dd>${esc(o.size_note)}</dd>`:''}${o.colour_note?`<dt>রঙ</dt><dd>${esc(o.colour_note)}</dd>`:''}${o.polish_note?`<dt>পালিশ</dt><dd>${esc(o.polish_note)}</dd>`:''}${o.wanted_date?`<dt>কবে চাই</dt><dd>${esc(o.wanted_date)}</dd>`:''}${o.notes?`<dt>নোট</dt><dd>${esc(o.notes)}</dd>`:''}</dl>
<div class="row"><select aria-label="অবস্থা">${ST.map(s=>`<option value="${s[0]}" ${o.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select><a class="b p" target="_blank" rel="noopener noreferrer" href="${wa}">WhatsApp</a><a class="b" href="tel:${esc(o.phone)}">কল</a><a class="b" target="_blank" rel="noopener noreferrer" href="${/^https:\/\//.test(o.map_link)?esc(o.map_link):'#'}">ম্যাপ</a><button class="b" data-a="pics">ছবি দেখুন</button><button class="b d" data-a="rmpics">ছবি মুছুন</button><button class="b d" data-a="del">অর্ডার মুছুন</button></div><div class="pics" hidden></div>`;
c.querySelector('select').onchange=async e=>{const v=e.target.value,r=await sb.from('orders').update({status:v}).eq('id',o.id);if(r.error){toast('বদলানো যায়নি');e.target.value=o.status;return}o.status=v;toast('অবস্থা বদলেছে');render()};
c.querySelector('[data-a=pics]').onclick=async()=>{const p=c.querySelector('.pics');if(!p.hidden){p.hidden=true;return}p.innerHTML='';p.hidden=false;if(o.selfie_path==='deleted'){p.textContent='ছবি মুছে ফেলা হয়েছে।';return}
for(const [k,l] of [['selfie_path','নিজের ছবি'],['id_path','পরিচয়পত্র']]){const r=await sb.storage.from('kyc').createSignedUrl(o[k],300);const f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=l;f.appendChild(cap);if(r.error){f.appendChild(document.createTextNode('দেখানো যায়নি'))}else{const i=document.createElement('img');i.src=r.data.signedUrl;i.alt=l;i.onclick=()=>window.open(r.data.signedUrl,'_blank','noopener');f.appendChild(i)}p.appendChild(f)}};
c.querySelector('[data-a=rmpics]').onclick=async()=>{if(o.selfie_path==='deleted')return toast('আগেই মুছেছে');if(!confirm('দুটি ছবিই স্থায়ীভাবে মুছবেন? (অর্ডার সম্পন্ন হলে মোছা নিয়ম)'))return;const r=await sb.storage.from('kyc').remove([o.selfie_path,o.id_path]);if(r.error)return toast('মোছা যায়নি');await sb.from('orders').update({selfie_path:'deleted',id_path:'deleted'}).eq('id',o.id);o.selfie_path=o.id_path='deleted';toast('ছবি মুছে গেছে');c.querySelector('.pics').hidden=true};
c.querySelector('[data-a=del]').onclick=async()=>{if(!confirm('AV-'+o.order_no+' অর্ডারটি স্থায়ীভাবে মুছবেন?'))return;if(o.selfie_path!=='deleted')await sb.storage.from('kyc').remove([o.selfie_path,o.id_path]);const r=await sb.from('orders').delete().eq('id',o.id);if(r.error)return toast('মোছা যায়নি');ORD=ORD.filter(x=>x.id!==o.id);toast('অর্ডার মুছেছে');render()};
return c}
function rReviews(){const m=$('#m');m.innerHTML='';const g=(h,a)=>{m.insertAdjacentHTML('beforeend',`<div class="sec">${h} (${a.length})</div>`);if(!a.length)m.insertAdjacentHTML('beforeend','<div class="msg">নেই।</div>');a.forEach(r=>m.appendChild(rCard(r)))};g('অনুমোদনের অপেক্ষায়',REV.filter(x=>!x.approved));g('অনুমোদিত',REV.filter(x=>x.approved))}
function rCard(r){const c=document.createElement('div');c.className='cd rv';c.innerHTML=`<div class="top"><div><b>${esc(r.user_name||'—')}</b><br><small>পণ্য: ${esc(r.product_id)} · ${dt(r.created_at)}</small></div><span class="st ${r.approved?'s1':'s0'}">${r.approved?'অনুমোদিত':'অপেক্ষায়'}</span></div><p></p><div class="row"><button class="b p" data-a="ap">${r.approved?'অনুমোদন তুলুন':'অনুমোদন দিন'}</button><button class="b d" data-a="del">মুছুন</button></div>`;c.querySelector('p').textContent=r.body;
c.querySelector('[data-a=ap]').onclick=async()=>{const v=!r.approved,x=await sb.from('reviews').update({approved:v}).eq('id',r.id);if(x.error)return toast('বদলানো যায়নি');r.approved=v;toast(v?'অনুমোদিত':'সরানো হয়েছে');render()};
c.querySelector('[data-a=del]').onclick=async()=>{if(!confirm('রিভিউটি মুছবেন?'))return;const x=await sb.from('reviews').delete().eq('id',r.id);if(x.error)return toast('মোছা যায়নি');REV=REV.filter(y=>y.id!==r.id);render()};return c}
function rUsers(){const m=$('#m');m.innerHTML=`<div class="sec">ব্যবহারকারী (${USR.length})</div>`;if(!USR.length)m.insertAdjacentHTML('beforeend','<div class="msg">নেই।</div>');
USR.forEach(u=>{const c=document.createElement('div');c.className='cd';c.innerHTML=`<div class="top"><div><b></b><br><small dir="ltr" style="display:block;text-align:left"></small></div><span class="st ${u.blocked?'s0':''}">${u.blocked?'ব্লক করা':'সক্রিয়'}</span></div><dl class="kv"><dt>লগইন</dt><dd>${esc(u.provider)}</dd><dt>যোগ দিয়েছেন</dt><dd>${dt(u.created_at)}</dd><dt>শেষ লগইন</dt><dd>${dt(u.last_sign_in_at)}</dd></dl><div class="row"><button class="b ${u.blocked?'p':'d'}">${u.blocked?'ব্লক তুলুন':'ব্লক করুন'}</button></div>`;
c.querySelector('b').textContent=u.name||'—';c.querySelector('small').textContent=u.email||'';
c.querySelector('.row button').onclick=async()=>{if(u.email===ADMIN)return toast('নিজেকে ব্লক করা যাবে না');let x;if(u.blocked){x=await sb.from('blocked_users').delete().eq('user_id',u.id)}else{if(!confirm('এই ব্যবহারকারীকে ব্লক করবেন? সে আর অর্ডার বা রিভিউ দিতে পারবে না।'))return;x=await sb.from('blocked_users').insert({user_id:u.id,email:u.email})}if(x.error)return toast('বদলানো যায়নি');u.blocked=!u.blocked;toast(u.blocked?'ব্লক করা হয়েছে':'ব্লক তোলা হয়েছে');render()};m.appendChild(c)})}
(async()=>{theme(sget('aurevo-theme')||'dark');
if(!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY))return msg('সংযোগ নেই','config.js পাওয়া যায়নি।');
try{await loadSB();sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);const r=await sb.auth.getSession();USER=r.data.session?r.data.session.user:null}catch(e){return msg('সংযোগ নেই','Supabase লোড হয়নি।')}
if(!USER)return msg('Admin লগইন','শুধু Admin-এর Gmail দিয়ে লগইন করুন।','লগইন করুন',()=>{sset('aurevo-next','admin.html');location.href='index.html#login'});
$('#lo').hidden=false;
if((USER.email||'').toLowerCase()!==ADMIN)return msg('অনুমতি নেই','এই পাতা শুধু Admin-এর জন্য।<br><small class="er">'+esc(USER.email||'')+'</small>');
$('#tb').hidden=false;$('#rf').hidden=false;await loadAll()})();
</script>
</body>
</html>
